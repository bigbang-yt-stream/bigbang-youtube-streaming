<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BIGBANG YouTube Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f1e8;
      color: #171717;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      background: #fffdf8;
      min-height: 100vh;
    }

    /* 상단 */
    header {
      padding: 18px 20px 14px;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid #e8e1d5;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .crown {
      color: #c79a32;
      margin-right: 5px;
    }

    .language {
      font-size: 12px;
      font-weight: 700;
    }

    .language span {
      color: #b88a28;
    }

    nav {
      display: flex;
      gap: 18px;
      margin-top: 14px;
      overflow-x: auto;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* HERO */
    .hero {
      padding: 22px 18px 32px;
    }

    .hero-copy {
      text-align: center;
      padding: 8px 5px 24px;
    }

    .hero-side {
      display: flex;
      justify-content: space-between;
      color: #b88a28;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
      margin-bottom: 12px;
    }

    .hero-copy h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 48px);
      line-height: 1.2;
      letter-spacing: -1.5px;
    }

    .hero-copy p {
      margin: 12px 0 0;
      color: #777169;
      font-size: 14px;
      line-height: 1.7;
    }

    .hero-photo {
      width: 100%;
      display: block;
      border-radius: 20px;
    }

    /* 참여 영역 */
    .join {
      padding: 12px 18px 40px;
    }

    .eyebrow {
      color: #b88a28;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.2px;
      margin-bottom: 7px;
    }

    .join h2 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: -1px;
    }

    .join-intro {
      margin: 0 0 20px;
      color: #777169;
      font-size: 13px;
      line-height: 1.6;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action {
      min-height: 145px;
      padding: 20px;
      background: #fff;
      border: 1px solid #e4ddd1;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 5px 18px rgba(34,28,18,.04);
    }

    .action-icon {
      font-size: 25px;
    }

    .action small {
      color: #b88a28;
      font-weight: 800;
      font-size: 10px;
      letter-spacing: .8px;
    }

    .action strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
    }

    .action-arrow {
      font-weight: 900;
      font-size: 14px;
    }

    .guide-link {
      display: block;
      margin-top: 12px;
      padding: 15px 18px;
      border-radius: 14px;
      background: #171717;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .guide-link span {
      float: right;
      color: #d5aa48;
    }

    @media (max-width: 520px) {
      header {
        padding-left: 16px;
        padding-right: 16px;
      }

      .brand {
        font-size: 21px;
      }

      nav {
        gap: 15px;
      }

      .hero {
        padding-left: 14px;
        padding-right: 14px;
      }

      .hero-copy {
        padding-left: 5px;
        padding-right: 5px;
      }

      .action-grid {
        grid-template-columns: 1fr 1fr;
      }

      .action {
        min-height: 135px;
        padding: 16px;
      }

      .action strong {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <header>
    <div class="top">
      <div class="brand">
        <span class="crown">♛</span>BIGBANG
      </div>

      <div class="language">
        <span>한국어</span> · EN
      </div>
    </div>

    <nav>
      <a href="index.html">HOME</a>
      <a href="video.html">VIDEO</a>
      <a href="audio.html">AUDIO</a>
      <a href="chart.html">CHART</a>
      <a href="archive.html">ARCHIVE</a>
    </nav>
  </header>


  <main>

    <section class="hero">

      <div class="hero-copy">

        <div class="hero-side">
          <span>STILL WE ARE BIGBANG</span>
          <span>VIP ALWAYS HERE♡</span>
        </div>

        <h1>
          BIGBANG의 음악,<br>
          VIP가 함께하는 공간.
        </h1>

        <p>
          듣고, 보고, 기록하고, 함께해요.
        </p>

      </div>

      <img
        class="hero-photo"
        src="../hero-bigbang.jpg"
        alt="BIGBANG"
      >

    </section>


    <section class="join">

      <div class="eyebrow">START WITH BIGBANG</div>

      <h2>지금 함께해요</h2>

      <p class="join-intro">
        원하는 방식으로 BIGBANG의 음악과 영상을 함께 즐겨보세요.
      </p>

      <div class="action-grid">

        <a class="action" href="video.html">
          <div class="action-icon">▶</div>

          <div>
            <small>VIDEO</small>
            <strong>뮤비 함께 보기</strong>
          </div>

          <div class="action-arrow">바로가기 →</div>
        </a>


        <a class="action" href="audio.html">
          <div class="action-icon">♪</div>

          <div>
            <small>AUDIO</small>
            <strong>음악 함께 듣기</strong>
          </div>

          <div class="action-arrow">바로가기 →</div>
        </a>

      </div>

      <a class="guide-link" href="video.html">
        처음이라면? 스트리밍 가이드부터
        <span>→</span>
      </a>

    </section>

  </main>

</div>

</body>
</html>
